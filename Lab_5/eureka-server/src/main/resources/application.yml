server:
  port: ${EUREKA_PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: true
  client:
    # Don't register itself as a client
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Disable self-preservation mode for development
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    # Wait time for service deregistration
    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL:5000}
    # Response cache update interval
    response-cache-update-interval-ms: ${EUREKA_CACHE_UPDATE_INTERVAL:5000}

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
