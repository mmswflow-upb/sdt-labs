server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/professordb}
    username: ${SPRING_DATASOURCE_USERNAME:professor}
    password: ${SPRING_DATASOURCE_PASSWORD:professor}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# External service URLs
services:
  course:
    url: ${COURSE_SERVICE_URL:http://course-service:8080}
