server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gradingdb}
    username: ${SPRING_DATASOURCE_USERNAME:grading}
    password: ${SPRING_DATASOURCE_PASSWORD:grading}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# External service URLs
services:
  student:
    url: ${STUDENT_SERVICE_URL:http://student-service:8080}
  professor:
    url: ${PROFESSOR_SERVICE_URL:http://professor-service:8080}
  course:
    url: ${COURSE_SERVICE_URL:http://course-service:8080}
