name: sdt-lab5

services:
  eureka-server:
    build: ./eureka-server
    image: sdt-lab5-eureka-server
    container_name: sdt-lab5-eureka-server
    environment:
      EUREKA_PORT: ${EUREKA_PORT:-8761}
      EUREKA_HOSTNAME: eureka-server
      EUREKA_SELF_PRESERVATION: ${EUREKA_SELF_PRESERVATION:-false}
      EUREKA_EVICTION_INTERVAL: ${EUREKA_EVICTION_INTERVAL:-5000}
      EUREKA_CACHE_UPDATE_INTERVAL: ${EUREKA_CACHE_UPDATE_INTERVAL:-5000}
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    networks:
      - sdt-lab5-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    build: ./api-gateway
    image: sdt-lab5-api-gateway
    container_name: sdt-lab5-api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      student-service:
        condition: service_started
      professor-service:
        condition: service_started
      course-service:
        condition: service_started
      grading-service:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - sdt-lab5-net

  student-db:
    image: postgres:16
    container_name: sdt-lab5-student-db
    environment:
      POSTGRES_DB: ${STUDENT_DB_NAME:-studentdb}
      POSTGRES_USER: ${STUDENT_DB_USER:-student}
      POSTGRES_PASSWORD: ${STUDENT_DB_PASSWORD:-student}
    ports:
      - "${STUDENT_DB_PORT:-5433}:5432"
    networks:
      - sdt-lab5-net
    volumes:
      - sdt-lab5-student-db-data:/var/lib/postgresql/data

  professor-db:
    image: postgres:16
    container_name: sdt-lab5-professor-db
    environment:
      POSTGRES_DB: ${PROFESSOR_DB_NAME:-professordb}
      POSTGRES_USER: ${PROFESSOR_DB_USER:-professor}
      POSTGRES_PASSWORD: ${PROFESSOR_DB_PASSWORD:-professor}
    ports:
      - "${PROFESSOR_DB_PORT:-5434}:5432"
    networks:
      - sdt-lab5-net
    volumes:
      - sdt-lab5-professor-db-data:/var/lib/postgresql/data

  course-db:
    image: postgres:16
    container_name: sdt-lab5-course-db
    environment:
      POSTGRES_DB: ${COURSE_DB_NAME:-coursedb}
      POSTGRES_USER: ${COURSE_DB_USER:-course}
      POSTGRES_PASSWORD: ${COURSE_DB_PASSWORD:-course}
    ports:
      - "${COURSE_DB_PORT:-5435}:5432"
    networks:
      - sdt-lab5-net
    volumes:
      - sdt-lab5-course-db-data:/var/lib/postgresql/data

  grading-db:
    image: postgres:16
    container_name: sdt-lab5-grading-db
    environment:
      POSTGRES_DB: ${GRADING_DB_NAME:-gradingdb}
      POSTGRES_USER: ${GRADING_DB_USER:-grading}
      POSTGRES_PASSWORD: ${GRADING_DB_PASSWORD:-grading}
    ports:
      - "${GRADING_DB_PORT:-5436}:5432"
    networks:
      - sdt-lab5-net
    volumes:
      - sdt-lab5-grading-db-data:/var/lib/postgresql/data

  student-service:
    build: ./student-service
    image: sdt-lab5-student-service
    container_name: sdt-lab5-student-service
    depends_on:
      eureka-server:
        condition: service_healthy
      student-db:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://student-db:5432/${STUDENT_DB_NAME:-studentdb}
      SPRING_DATASOURCE_USERNAME: ${STUDENT_DB_USER:-student}
      SPRING_DATASOURCE_PASSWORD: ${STUDENT_DB_PASSWORD:-student}
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL:-http://course-service:8080}
      GRADING_SERVICE_URL: ${GRADING_SERVICE_URL:-http://grading-service:8080}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-true}
    ports:
      - "${STUDENT_SERVICE_PORT:-8081}:8080"
    networks:
      - sdt-lab5-net

  professor-service:
    build: ./professor-service
    image: sdt-lab5-professor-service
    container_name: sdt-lab5-professor-service
    depends_on:
      eureka-server:
        condition: service_healthy
      professor-db:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://professor-db:5432/${PROFESSOR_DB_NAME:-professordb}
      SPRING_DATASOURCE_USERNAME: ${PROFESSOR_DB_USER:-professor}
      SPRING_DATASOURCE_PASSWORD: ${PROFESSOR_DB_PASSWORD:-professor}
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL:-http://course-service:8080}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-true}
    ports:
      - "${PROFESSOR_SERVICE_PORT:-8082}:8080"
    networks:
      - sdt-lab5-net

  course-service:
    build: ./course-service
    image: sdt-lab5-course-service
    container_name: sdt-lab5-course-service
    depends_on:
      eureka-server:
        condition: service_healthy
      course-db:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://course-db:5432/${COURSE_DB_NAME:-coursedb}
      SPRING_DATASOURCE_USERNAME: ${COURSE_DB_USER:-course}
      SPRING_DATASOURCE_PASSWORD: ${COURSE_DB_PASSWORD:-course}
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-true}
    ports:
      - "${COURSE_SERVICE_PORT:-8083}:8080"
    networks:
      - sdt-lab5-net

  grading-service:
    build: ./grading-service
    image: sdt-lab5-grading-service
    container_name: sdt-lab5-grading-service
    depends_on:
      eureka-server:
        condition: service_healthy
      grading-db:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://grading-db:5432/${GRADING_DB_NAME:-gradingdb}
      SPRING_DATASOURCE_USERNAME: ${GRADING_DB_USER:-grading}
      SPRING_DATASOURCE_PASSWORD: ${GRADING_DB_PASSWORD:-grading}
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka-server:8761/eureka/}
      STUDENT_SERVICE_URL: ${STUDENT_SERVICE_URL:-http://student-service:8080}
      PROFESSOR_SERVICE_URL: ${PROFESSOR_SERVICE_URL:-http://professor-service:8080}
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL:-http://course-service:8080}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-true}
    ports:
      - "${GRADING_SERVICE_PORT:-8084}:8080"
    networks:
      - sdt-lab5-net

networks:
  sdt-lab5-net:
    driver: bridge

volumes:
  sdt-lab5-student-db-data:
  sdt-lab5-professor-db-data:
  sdt-lab5-course-db-data:
  sdt-lab5-grading-db-data:
